name: Build Android XR Debug APKs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-xr-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "4.6.3-stable"
  OPENXR_VENDORS_VERSION: "5.1.0-stable"
  GODOT_EDITOR_SHA256: 702a8a6785060203fd46373adf864586ecf0c377ac685d7107dde66b1eba0a9e
  GODOT_TEMPLATES_SHA256: 6436f474ee085fb0a94d3d296b9821736bdd663b6e91b2228fdf77066f1d1400
  OPENXR_VENDORS_SHA256: 6a838dbdf4115549e4511ebee0da9a5dcc8f9f6258d4cc2f2ee57a907a3e2911
  SCENE_SYNC_RAPIER_TAG: scenesync-v0.8.28-r0.30.0.3
  SCENE_SYNC_RAPIER_ASSET_SHA256: 90dbbbef3ddfd4e9d6fa34bed713dd1417a2ead70bbde668de6857c131cafbae
  SCENE_SYNC_RAPIER_LINUX_SHA256: eba85afa6f74362327bee1671a5b8ef2a025bf10676ea62faa33f9fcdedd9c7e
  SCENE_SYNC_RAPIER_ANDROID_SHA256: 8cbd6c0f566dd1333eb45917d8e923378b4c148c5b64df63fb12704e14f87caf
  TOOLCHAIN_CACHE_DIR: /home/runner/.cache/scene-sync-godot

jobs:
  prepare-toolchain:
    name: Prepare pinned Godot toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Cache pinned Godot downloads
        id: godot-download-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE_DIR }}
          key: ${{ runner.os }}-godot-mono-${{ env.GODOT_RELEASE }}-${{ env.GODOT_EDITOR_SHA256 }}-${{ env.GODOT_TEMPLATES_SHA256 }}-openxr-vendors-${{ env.OPENXR_VENDORS_VERSION }}-${{ env.OPENXR_VENDORS_SHA256 }}

      - name: Download Godot .NET and OpenXR Vendors
        if: steps.godot-download-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TOOLCHAIN_CACHE_DIR"

          GODOT_ARCHIVE="$TOOLCHAIN_CACHE_DIR/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          TEMPLATES_ARCHIVE="$TOOLCHAIN_CACHE_DIR/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          VENDORS_ARCHIVE="$TOOLCHAIN_CACHE_DIR/godotopenxrvendorsaddon-${OPENXR_VENDORS_VERSION}.zip"

          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip" \
            --output "$GODOT_ARCHIVE"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz" \
            --output "$TEMPLATES_ARCHIVE"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${OPENXR_VENDORS_VERSION}/godotopenxrvendorsaddon.zip" \
            --output "$VENDORS_ARCHIVE"

          printf '%s  %s\n' \
            "$GODOT_EDITOR_SHA256" "$GODOT_ARCHIVE" \
            "$GODOT_TEMPLATES_SHA256" "$TEMPLATES_ARCHIVE" \
            "$OPENXR_VENDORS_SHA256" "$VENDORS_ARCHIVE" \
            | sha256sum --check --strict

  build-apk:
    name: Build ${{ matrix.preset }}
    needs: prepare-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Meta Quest 3 Debug
            apk: scene-sync-godot-quest3-debug.apk
            artifact: scene-sync-godot-quest3-debug
          - preset: PICO 4 Ultra Debug
            apk: scene-sync-godot-pico4-ultra-debug.apk
            artifact: scene-sync-godot-pico4-ultra-debug
          - preset: VIVE Focus Vision Debug
            apk: scene-sync-godot-vive-focus-vision-debug.apk
            artifact: scene-sync-godot-vive-focus-vision-debug
          - preset: Android XR Debug
            apk: scene-sync-godot-android-xr-debug.apk
            artifact: scene-sync-godot-android-xr-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vendored Scene Sync Rapier runtime
        shell: bash
        run: |
          set -euo pipefail

          BUILD_INFO=addons/godot-rapier3d/SCENESYNC_BUILD.txt
          LINUX_LIBRARY=addons/godot-rapier3d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so
          ANDROID_LIBRARY=addons/godot-rapier3d/bin/libgodot_rapier.android.aarch64-linux-android.so
          test -f addons/godot-rapier3d/godot-rapier3d.gdextension
          grep -Fxq "tag=$SCENE_SYNC_RAPIER_TAG" "$BUILD_INFO"
          grep -Fxq "asset_sha256=$SCENE_SYNC_RAPIER_ASSET_SHA256" "$BUILD_INFO"
          printf '%s  %s\n' \
            "$SCENE_SYNC_RAPIER_LINUX_SHA256" "$LINUX_LIBRARY" \
            "$SCENE_SYNC_RAPIER_ANDROID_SHA256" "$ANDROID_LIBRARY" \
            | sha256sum --check --strict

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.203"

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Restore pinned Godot downloads
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TOOLCHAIN_CACHE_DIR }}
          key: ${{ runner.os }}-godot-mono-${{ env.GODOT_RELEASE }}-${{ env.GODOT_EDITOR_SHA256 }}-${{ env.GODOT_TEMPLATES_SHA256 }}-openxr-vendors-${{ env.OPENXR_VENDORS_VERSION }}-${{ env.OPENXR_VENDORS_SHA256 }}
          fail-on-cache-miss: true

      - name: Verify pinned Godot downloads
        shell: bash
        run: |
          set -euo pipefail

          GODOT_ARCHIVE="$TOOLCHAIN_CACHE_DIR/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          TEMPLATES_ARCHIVE="$TOOLCHAIN_CACHE_DIR/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          VENDORS_ARCHIVE="$TOOLCHAIN_CACHE_DIR/godotopenxrvendorsaddon-${OPENXR_VENDORS_VERSION}.zip"

          printf '%s  %s\n' \
            "$GODOT_EDITOR_SHA256" "$GODOT_ARCHIVE" \
            "$GODOT_TEMPLATES_SHA256" "$TEMPLATES_ARCHIVE" \
            "$OPENXR_VENDORS_SHA256" "$VENDORS_ARCHIVE" \
            | sha256sum --check --strict

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-godot-mono-${{ env.GODOT_RELEASE }}-${{ hashFiles('project.godot', 'export_presets.cfg', '*.csproj', '*.sln') }}
          restore-keys: |
            ${{ runner.os }}-gradle-godot-mono-${{ env.GODOT_RELEASE }}-

      - name: Install Godot .NET and Android export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_ARCHIVE="$TOOLCHAIN_CACHE_DIR/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          TEMPLATES_ARCHIVE="$TOOLCHAIN_CACHE_DIR/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          GODOT_DIR="$RUNNER_TEMP/godot-${GODOT_RELEASE}-mono"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"

          test -s "$GODOT_ARCHIVE"
          test -s "$TEMPLATES_ARCHIVE"
          mkdir -p "$GODOT_DIR" "$TEMPLATES_DIR"
          unzip -q "$GODOT_ARCHIVE" -d "$GODOT_DIR"
          unzip -q -j "$TEMPLATES_ARCHIVE" \
            templates/android_debug.apk \
            templates/android_source.zip \
            templates/version.txt \
            -d "$TEMPLATES_DIR"

          mapfile -t GODOT_BINARIES < <(
            find "$GODOT_DIR" -type f -name 'Godot_v*_mono_linux.x86_64' -print
          )
          test "${#GODOT_BINARIES[@]}" -eq 1
          GODOT_BIN="${GODOT_BINARIES[0]}"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -q '^4\.6\.3\.stable\.mono'
          grep -q '^4\.6\.3\.stable' "$TEMPLATES_DIR/version.txt"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install OpenXR Vendors plugin
        shell: bash
        run: |
          set -euo pipefail

          VENDORS_ARCHIVE="$TOOLCHAIN_CACHE_DIR/godotopenxrvendorsaddon-${OPENXR_VENDORS_VERSION}.zip"
          VENDORS_DIR="$RUNNER_TEMP/openxr-vendors-${OPENXR_VENDORS_VERSION}"

          test -s "$VENDORS_ARCHIVE"
          test ! -e addons/godotopenxrvendors
          mkdir -p "$VENDORS_DIR" addons
          unzip -q "$VENDORS_ARCHIVE" -d "$VENDORS_DIR"
          cp -R "$VENDORS_DIR/asset/addons/godotopenxrvendors" addons/
          test -f addons/godotopenxrvendors/plugin.gdextension

      - name: Restore and build .NET project
        shell: bash
        run: |
          set -euo pipefail

          test -f SceneSyncGodot.sln
          dotnet restore SceneSyncGodot.sln
          dotnet build SceneSyncGodot.sln --configuration Debug --no-restore

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import

      - name: Export ${{ matrix.preset }} APK
        shell: bash
        env:
          EXPORT_PRESET: ${{ matrix.preset }}
          OUTPUT_APK: build/${{ matrix.apk }}
        run: |
          set -euo pipefail

          mkdir -p build
          "$GODOT_BIN" --headless --path . \
            --install-android-build-template \
            --export-debug "$EXPORT_PRESET" \
            "$OUTPUT_APK"
          test -s "$OUTPUT_APK"
          APK_ENTRIES="$RUNNER_TEMP/${EXPORT_PRESET// /-}-apk-entries.txt"
          unzip -Z1 "$OUTPUT_APK" > "$APK_ENTRIES"
          grep -Fxq \
            'lib/arm64-v8a/libgodot_rapier.android.aarch64-linux-android.so' \
            "$APK_ENTRIES"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 14
